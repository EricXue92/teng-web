name: Refresh Google Scholar citations

on:
  schedule:
    # Every hour: Scholar answers 403 to about two runs in three (each run is
    # a fresh runner, so each attempt is independent), and one success a day
    # is enough. Four runs a day went a day or more without one.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # Only the primary repo commits; the legacy mirror receives the commit
    # with the next regular push.
    if: github.repository == 'polyucmi/teng-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/fetch_scholar.py
      - name: Commit if changed
        run: |
          git diff --quiet data/scholar.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: refresh Google Scholar citation count" data/scholar.json
          git pull --rebase
          git push
